[project]
name = "myjobbuddyengine"
version = "0.1.0"
description = "FastAPI PDF resume parsing service with external ChromaDB indexing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"chromadb>=1.0.0",
	"fastapi>=0.115.0",
	"langchain-core>=0.3.0",
	"langchain-mistralai>=1.1.6",
	"langchain-nvidia-ai-endpoints>=0.3.0",
	"pydantic>=2.0.0",
	"pymupdf>=1.28.2",
	"python-dotenv>=1.0.0",
	"python-multipart>=0.0.9",
	"uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
	"pytest>=8.0.0",
]
